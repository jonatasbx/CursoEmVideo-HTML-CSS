<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boxes</title>
    <style>
        h1{
            height: 300px;
            width: 300px;
            background-color: salmon;
            border: 10px solid darkslategray;
            padding: 10px; /* top, right, bottom, left se todas as medidas forem iguais é só colocar padding 10px */
            margin: 10px auto 10px auto; /* top, right, bottom, left se todas as medidas forem iguais é só colocar margin 10px, a configuração que esta no codigo centraliza  */
            outline: 5px dashed salmon;
        }
        a{
            border: 5px groove rgb(223, 49, 49);
            padding: 10px 10px 10px 10px;
            margin: 10px 10px 10px 10px;
        }
    </style>
</head>
<body>
    <h1>Exemplo de caixa box-level</h1>
    <p>Paragrafos tambem são exemplos de caixas box level, mas <a href="#">link são exemplos de caixas inline</a></p>
</body>
</html>
