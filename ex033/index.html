<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }
        iframe{
            width: 600px;
            height: 600px;
            border-radius: 10px;
        }
    </style>
    <title>Iframe</title>
</head>
<body>
    <h1>Aula sobre Iframe</h1>
    <p>Acessando o site do <iframe src="https://www.cursoemvideo.com" frameborder="0" scrolling="no"><a href="https://www.cursoemvideo.com" target="_blank">Curso em Video</a></iframe> para aprender a programar</p>

    <p>O site do <iframe src="https://google.com.br" frameborder="0"><a href="https://google.com.br" target="_blank">Google</a></iframe> é muito legal, pena que não funciona dentro do Iframe</p>

    <p>O repositorio do Guanabara <iframe src="https://gustavoguanabara.github.io" frameborder="0"><a href="https://gustavoguanabara.github.io" target="_blank">Gustavo Guanabara</a></iframe> é bem legal</p>
</body>
</html>
