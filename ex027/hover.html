<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body{
            font-family: 'Courier New', Courier, monospace ;
        }
        div:hover{
            color: blueviolet;

        }
        div > p{
           display: none;
        }
        div:hover > p{
            display: block;
        }
    </style>
    <title>Exemplo de Hover</title>
</head>
<body>
    <h1>
        Exemplo de Hover
    </h1>
    <p>Passe o mouse sobre o texto abaixo</p>
    <div>Passe o mouse aqui
        <p>Paragrafo escondido na DIV</p>
    </div>
    <p>Fim do exemplo</p>
</body>
</html>
