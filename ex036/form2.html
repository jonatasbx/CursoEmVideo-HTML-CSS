<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <main>
        <h1>Formulário</h1>
        <form action="" method="post" autocomplete="on">
            <fieldset>
                <legend>Cores</legend>
                <label for="icor">Cor: </label>
                <input type="color" name="cor" id="icor" value="white">
            </fieldset>
            <fieldset>
                <legend>Nivel de Satisfação</legend>
                <label for="isats">Satisfação: </label>
                <input type="range" name="sats" id="isats" min="1" max="5" value="5">
            </fieldset>
            <fieldset>
                <legend>Foto de Perfil</legend>
                <label for="ifoto">Foto de Perfil: </label>
                <input type="file" name="foto" id="ifoto">
            </fieldset>
            <br><br>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </form>
    </main>
</body>
</html>
