<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }
        table{
            border-collapse: collapse;
            width: 500px;
            height: 500px;
        }
        thead{
            background-color: gray;
            color: white;
            font-weight: bold;
            height: 50px;
            text-align: center;
        }
        td, th{
            border: 1px solid black;
            text-align: center;
        }

    </style>
    <title>Nova tabela</title>
</head>
<body>
    <h1>Tabela de filmes</h1>
    <table>
        <thead>
                <th scope="col">Grupo</th>
                <th scope="col">Nomes</th>
                <th colspan="3" scope="colgroup">Filmes</th>
        </thead>
            <tbody>
                <tr>
                    <th rowspan="3" scope="rowgroup"><strong>Mulheres</strong></th>
                    <td>Ana Maria</td>
                    <td>Hulk</td>
                    <td>Rambo</td>
                    <td>Vingadores</td>
                </tr>
                <tr>

                    <td>Beatriz Souza</td>
                    <td>Hulk</td>
                    <td>Inception</td>
                    <td>Batman</td>
                </tr>
                <tr>

                    <td>Claudia Melo</td>
                    <td>Oblivion</td>
                    <td>Matrix</td>
                    <td>Big Hero</td>
                </tr>
                <tr>
                    <th rowspan="3" scope="rowgroup"><strong>Homens</strong></th>
                    <td>Bruno Mendonça</td>
                    <td>Intocaveis</td>
                    <td>Amnesia</td>
                    <td>Gladiador</td>
                </tr>
                <tr>
                    <td>Daniel Lourenço</td>
                    <td>Wll-e'</td>
                    <td>Oldboy</td>
                    <td>Dangal</td>
                </tr>
                <tr>
                    <td>Fabiano Mota</td>
                    <td>Star Wars 5</td>
                    <td>Taxi Driver</td>
                    <td>Toy Story</td>
                </tr>
            </tbody>
    </table>
</body>
</html>
